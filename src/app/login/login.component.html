<div class="login-container">
  <div class="login-card">
    <!-- Header -->
    <div class="header">
      <h1 class="brand">NEXX</h1>
    </div>

    <!-- Title -->
    <h2 class="title">Sign in to Continue</h2>

    <!-- User Icon -->
    <div class="user-icon">
      <b class="icon">👥</b>
    </div>

    <!-- Single Form with both fields -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="form-step">
      <div class="input-group">
        <input
          #usernameInput
          type="email"
          class="form-input"
          placeholder="Enter Username"
          formControlName="username"
          [class.error]="showUsernameError"
        />
      </div>

      <div class="input-group">
        <input
          #passwordInput
          [type]="hidePassword ? 'password' : 'text'"
          class="form-input"
          placeholder="Enter Password"
          formControlName="password"
        />
        <button type="button" class="input-icon-btn" (click)="togglePasswordVisibility()">
          <b class="lock-icon">{{ hidePassword ? '🔒' : '👁️' }}</b>
        </button>
      </div>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <!-- Footer -->
    <div class="footer">
      <div class="copyright">2025 - NexxLicense v{{currentVersion}}</div>
      <div class="description">NexxLicense - License Application</div>
    </div>
  </div>
</div>
