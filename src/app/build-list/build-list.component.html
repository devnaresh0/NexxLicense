<!-- license-list.component.html -->
<div class="license-container">
  <div class="header">
    <div class="title-section">
      <h2>Builds</h2>
      <p class="subtitle">Allows to Issue/View Builds</p>
    </div>
    <div class="header-action">
      <button class="btn-logout" (click)="onLogout()">Logout</button>
      <button class="btn-new" (click)="createNewLicense()">New</button>
    </div>
  </div>

  <div class="filter-tabs"></div>

  <div class="search-section">
    <div class="search-controls">
      <div class="search-group">
        <label>Search For License</label>
        <div class="search-input-group">
          <input
            type="text"
            [(ngModel)]="searchTerm"
            placeholder="Search"
            class="search-input"
            (keyup.enter)="onSearch()"
          />
          <button class="btn-search" (click)="onSearch()">Search</button>
        </div>
      </div>
      <div class="order-group">
        <label>Order By</label>
        <select
          class="order-select"
          [ngModel]="sortBy"
          (ngModelChange)="onSortChange($event)"
        >
          <option value="search">Search</option>
          <option value="domain">Domain</option>
          <option value="customer">Customer</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Upload Container -->
  <div class="upload-section">
    <div class="upload-container" id="upload-container"></div>
    <div class="upload-actions">
      <button class="btn-upload" id="add-file">Add File</button>
      <button class="btn-submit" id="submit">Upload All</button>
    </div>
  </div>

  <div class="table-container">
    <table class="license-table">
      <thead>
        <tr class="table-header">
          <th>#</th>
          <th>Domain</th>
          <th>Customer</th>
          <th>Status</th>
          <th>Actions</th>
          <th *ngIf="isUploadMode">
            <input
              type="checkbox"
              [checked]="
                selectedLicenses.size === getPaginatedLicenses().length &&
                selectedLicenses.size > 0
              "
              (change)="toggleSelectAll($event)"
            />
          </th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let license of getPaginatedLicenses(); let i = index"
          class="table-row"
          [class.selected]="isLicenseSelected(license.id)"
        >
          <td>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
          <td>{{ license.domain }}</td>
          <td>{{ license.customerName }}</td>
          <td>
            <span class="status-badge" [class.active]="license.active === true">
              {{ license.active ? "Active" : "Inactive" }}
            </span>
          </td>
          <td>
            <div class="action-buttons">
              <button class="btn-action view" (click)="manageLicense(license)">
                Manage
              </button>
            </div>
          </td>
          <td *ngIf="isUploadMode">
            <input
              type="checkbox"
              [checked]="isLicenseSelected(license.id)"
              (change)="toggleLicenseSelection(license.id, $event)"
            />
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <div class="pagination-controls">
      <button
        *ngFor="let page of getPageNumbers()"
        class="page-btn"
        [class.active]="currentPage === page"
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>
    </div>
    <div class="page-info">Page {{ currentPage }} of {{ totalPages }}</div>
  </div>
</div>
