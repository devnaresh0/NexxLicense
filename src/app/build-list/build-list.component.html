<!-- license-list.component.html -->
<div class="license-container">
  <div class="header">
    <div class="title-section">
      <h2>Builds</h2>
      <p class="subtitle">Allows to Issue/View Builds</p>
    </div>
    <div class="header-action">
      <button class="btn-logout" (click)="onLogout()">Logout</button>
      <button class="btn-upload" (click)="toggleUploadMode()">Upload</button>
      <button class="btn-new" (click)="createNewLicense()">New</button>
    </div>
  </div>

  <div class="filter-tabs">
    <button
      class="tab"
      [class.active]="selectedFilter === 'All'"
      (click)="onFilterChange('All')"
    >
      All
    </button>
    <button
      class="tab"
      [class.active]="selectedFilter === 'Active'"
      (click)="onFilterChange('Active')"
    >
      Active
    </button>
    <button
      class="tab"
      [class.active]="selectedFilter === 'Inactive'"
      (click)="onFilterChange('Inactive')"
    >
      Inactive
    </button>
  </div>

  <div class="search-section">
    <div class="search-controls">
      <div class="search-group">
        <label>Search For License</label>
        <div class="search-input-group">
          <input
            type="text"
            [(ngModel)]="searchTerm"
            placeholder="Search"
            class="search-input"
            (keyup.enter)="onSearch()"
          />
          <button class="btn-search" (click)="onSearch()">Search</button>
        </div>
      </div>
      <div class="order-group">
        <label>Order By</label>
        <select
          class="order-select"
          [ngModel]="sortBy"
          (ngModelChange)="onSortChange($event)"
        >
          <option value="search">Search</option>
          <option value="domain">Domain</option>
          <option value="customer">Customer</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Upload Container -->
  <div class="upload-section" *ngIf="isUploadMode">
    <div class="upload-container" id="upload-container"></div>
    <div class="upload-actions">
      <button class="btn-upload" id="add-file">Add File</button>
      <button class="btn-submit" id="submit">Upload All</button>
    </div>
  </div>

  <div class="table-container">Recent Releases will show up here !</div>

  <div class="pagination">
    <div class="pagination-controls">
      <button
        *ngFor="let page of getPageNumbers()"
        class="page-btn"
        [class.active]="currentPage === page"
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>
    </div>
    <div class="page-info">Page {{ currentPage }} of {{ totalPages }}</div>
  </div>
</div>
