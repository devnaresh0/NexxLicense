<div class="header">
  <div class="title-section">
    <h2>Build Upload</h2>
    <p class="subtitle">Allows to Upload Build Sessions</p>
  </div>
  <div class="header-actions">
    <button class="btn-action btn-logout" (click)="onLogout()">Logout</button>
    <button class="btn-action btn-list" (click)="navigateTo('/build-list')">
      List
    </button>
  </div>
</div>
<div class="container">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div formArrayName="builds">
      <div
        class="build-row"
        *ngFor="let b of builds.controls; let i = index"
        [formGroupName]="i"
      >
        <div class="form-field">
          <label>Version</label>
          <input type="text" formControlName="version" />
        </div>

        <div class="form-field">
          <label>Start</label>
          <input type="date" formControlName="start_date" />
        </div>

        <div class="form-field">
          <label>End</label>
          <input type="date" formControlName="end_date" />
        </div>

        <div class="form-field">
          <label>Type</label>
          <select formControlName="app_type">
            <option value="NexxRetail">NexxRetail</option>
            <option value="NexxLicense">NexxLicense</option>
            <option value="Pos">Pos</option>
            <option value="Massenger">Massenger</option>
            <option value="ActiveMQ">ActiveMQ</option>
          </select>
        </div>

        <div class="form-field">
          <label>File</label>
          <input type="file" (change)="onFileChange($event, i)" />
        </div>

        <button
          type="button"
          class="btn-remove"
          *ngIf="builds.length > 1"
          (click)="removeBuild(i)"
        >
          ✕
        </button>
      </div>
    </div>

    <button type="button" class="btn-add" (click)="addBuild()">
      + Add File
    </button>
    <button type="submit" class="btn-submit">Submit</button>
  </form>

  <!-- ============================= -->
  <!-- CUSTOMER TABLE -->
  <!-- ============================= -->
  <h3 class="customer-section-title">Select Customers to Send Build To</h3>

  <div class="customer-selection">
    <label class="radio-option">
      <input type="radio" name="customerOption" value="all" (change)="onCustomerOptionChange('all')" [checked]="customerOption === 'all'">
      Send to All Customers
    </label>
    <label class="radio-option">
      <input type="radio" name="customerOption" value="select" (change)="onCustomerOptionChange('select')" [checked]="customerOption === 'select'">
      Select Specific Customers
    </label>
  </div>

  <div *ngIf="loadingLicenses">Loading customers...</div>

  <table class="customer-table" *ngIf="!loadingLicenses && licenses.length > 0 && customerOption === 'select'">
    <thead>
      <tr>
        <th>Select</th>
        <th>Customer</th>
        <th>Domain</th>
        <th>Serial No</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let lic of licenses">
        <td>
          <input
            type="checkbox"
            (change)="toggleLicenseSelection(lic.id, $event)"
          />
        </td>
        <td>{{ lic.customerName }}</td>
        <td>{{ lic.domain }}</td>
        <td>{{ lic.serialNumber }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loadingLicenses && licenses.length === 0">
    No customers found.
  </div>
</div>
