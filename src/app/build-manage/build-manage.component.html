<!-- license-detail.component.html -->
<div class="license-detail-container">
  <div class="header">
    <div class="title-section">
      <h2>License</h2>
      <p class="subtitle">Allows to Issue/View License</p>
    </div>
    <div class="header-actions">
      <button class="btn-action btn-logout" (click)="onLogout()">Logout</button>
      <button class="btn-action btn-list" (click)="navigateToBuilds()">Builds</button>
    </div>
  </div>

  <div class="license-header-section">
    <div class="section-title">License Header</div>
    <div class="header-form">
      <div class="form-group">
        <label>Serial No.</label>
        <input
          type="text"
          [(ngModel)]="licenseHeader.serialNumber"
          placeholder="Enter Serial No."
          class="form-input"
          [readonly]="!canEdit()"
        />
      </div>
      <div class="form-group">
        <label>Domain</label>
        <input
          type="text"
          [(ngModel)]="licenseHeader.domain"
          class="form-input"
          [readonly]="!canEdit()"
          placeholder="Enter domain name"
        />
      </div>
      <div class="form-group">
        <label>Customer Name</label>
        <input
          type="text"
          [(ngModel)]="licenseHeader.customerName"
          class="form-input"
          [readonly]="!canEdit()"
          placeholder="Enter customer name"
        />
      </div>
      <div class="form-group toggle-group">
        <label class="toggle-label">
          <input
            type="checkbox"
            [(ngModel)]="licenseHeader.active"
            class="toggle-input"
            [disabled]="!canEdit()"
          />
          <span class="toggle-slider"></span>
          Active
        </label>
      </div>
    </div>
  </div>

  <div class="license-details-section">
    <div class="section-title">
      License Details
      <button
        class="btn-add-module"
        (click)="toggleUploadMode()"
        *ngIf="canEdit()"
      >
        {{ isUploadMode ? "Cancel Upload" : "Upload File" }}
      </button>
    </div>

    <!-- Upload Section -->
    <div class="upload-section" *ngIf="isUploadMode">
      <div class="upload-container" id="upload-container"></div>
      <div class="upload-actions">
        <button class="btn-upload" id="add-file">Add File</button>
        <button class="btn-submit" id="submit-upload">Upload All</button>
      </div>
    </div>
  </div>
</div>
